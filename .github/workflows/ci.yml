name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go format
        run: gofmt -l .
      - name: Go vet
        run: go vet ./...
      - name: Unit tests
        run: go test -race ./...
      - name: Compile
        run: go build ./...
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t contscope:test .
