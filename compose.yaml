services:
  contscope:
    build: .
    restart: unless-stopped
    environment:
      CONTSCOPE_ADDR: ":8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - contscope_data:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
volumes:
  contscope_data:
